<svg width="480" height="72" viewBox="0 0 480 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2b0a17"/>
      <polygon points="0,40 20,0 34,0 14,40" fill="#FF2E8C"/>
      <polygon points="-26,40 -6,0 8,0 -12,40" fill="#FF2E8C"/>
      <animate attributeName="x" from="0" to="40" dur="1.1s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="480" height="72" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="480" height="72" fill="url(#stripes)"/>
    <rect width="480" height="72" fill="#0d0208" opacity="0.62"/>
  </g>
  <rect x="1" y="1" width="478" height="70" rx="13" fill="none" stroke="#FF6FB5" stroke-width="2"/>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .label { animation: pulse 1.8s ease-in-out infinite; }
  </style>
  <text class="label" x="240" y="43" text-anchor="middle" font-family="Verdana, Segoe UI, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">🚧 EM DESENVOLVIMENTO</text>
</svg>
