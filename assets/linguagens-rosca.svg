<svg width="460" height="240" viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes reveal {
        from { stroke-width: 0; opacity: 0; }
        to   { stroke-width: 30; opacity: 1; }
      }
      @keyframes spin {
        from { transform: rotate(-90deg); }
        to   { transform: rotate(270deg); }
      }
      @keyframes pulseRow {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.5; }
      }
      @keyframes pulseCenter {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.6; }
      }

      .ring { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
      .seg { animation: reveal 0.9s ease-out forwards; }
      .seg1 { animation-delay: 0s; }
      .seg2 { animation-delay: 0.15s; }
      .seg3 { animation-delay: 0.3s; }
      .seg4 { animation-delay: 0.45s; }
      .seg5 { animation-delay: 0.6s; }

      .center { animation: pulseCenter 2.4s ease-in-out infinite; }

      .row { animation: pulseRow 3s ease-in-out infinite; }
      .row1 { animation-delay: 0s; }
      .row2 { animation-delay: 0.4s; }
      .row3 { animation-delay: 0.8s; }
      .row4 { animation-delay: 1.2s; }
      .row5 { animation-delay: 1.6s; }
    </style>
  </defs>

  <rect width="460" height="240" rx="18" fill="#150109"/>

  <g class="ring">
    <circle class="seg seg1" cx="110" cy="120" r="70" fill="none" stroke="#FF2E8C" stroke-width="30" stroke-dasharray="175.93 263.89" stroke-dashoffset="0"/>
    <circle class="seg seg2" cx="110" cy="120" r="70" fill="none" stroke="#FF6FB5" stroke-width="30" stroke-dasharray="105.56 334.26" stroke-dashoffset="-175.93"/>
    <circle class="seg seg3" cx="110" cy="120" r="70" fill="none" stroke="#C2116B" stroke-width="30" stroke-dasharray="101.16 338.66" stroke-dashoffset="-281.49"/>
    <circle class="seg seg4" cx="110" cy="120" r="70" fill="none" stroke="#FFA5D2" stroke-width="30" stroke-dasharray="43.98 395.84" stroke-dashoffset="-382.65"/>
    <circle class="seg seg5" cx="110" cy="120" r="70" fill="none" stroke="#7A0A42" stroke-width="30" stroke-dasharray="13.20 426.62" stroke-dashoffset="-426.63"/>
  </g>

  <text class="center" x="110" y="126" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" font-weight="bold" fill="#ffffff">&lt;/&gt;</text>

  <g font-family="Segoe UI, Verdana, sans-serif" font-size="15">
    <g class="row row1">
      <rect x="240" y="42" width="14" height="14" rx="3" fill="#FF2E8C"/>
      <text x="262" y="53" fill="#ffffff">Python — 40%</text>
    </g>
    <g class="row row2">
      <rect x="240" y="74" width="14" height="14" rx="3" fill="#FF6FB5"/>
      <text x="262" y="85" fill="#ffffff">HTML — 24%</text>
    </g>
    <g class="row row3">
      <rect x="240" y="106" width="14" height="14" rx="3" fill="#C2116B"/>
      <text x="262" y="117" fill="#ffffff">C — 23%</text>
    </g>
    <g class="row row4">
      <rect x="240" y="138" width="14" height="14" rx="3" fill="#FFA5D2"/>
      <text x="262" y="149" fill="#ffffff">CSS — 10%</text>
    </g>
    <g class="row row5">
      <rect x="240" y="170" width="14" height="14" rx="3" fill="#7A0A42"/>
      <text x="262" y="181" fill="#ffffff">JavaScript — 3%</text>
    </g>
  </g>
</svg>
